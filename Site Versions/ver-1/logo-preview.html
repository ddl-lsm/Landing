<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0c0c0e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 48px; font-family: Inter, Arial, sans-serif; }
  .row { display: flex; align-items: center; gap: 32px; padding: 24px 36px; border: 1px solid #1e1e24; border-radius: 14px; }
  .label { color: #444; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; min-width: 130px; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">Оригинал</span>
    <img src="LOGO/logo27-5.1-square-1-600x600.png" width="40">
    <img src="LOGO/logo27-5.1-square-1-600x600.png" width="80">
    <img src="LOGO/logo27-5.1-square-1-600x600.png" width="140">
  </div>

  <div class="row">
    <span class="label">На тёмном фоне</span>
    <img src="LOGO/logo-dark.png" width="40">
    <img src="LOGO/logo-dark.png" width="80">
    <img src="LOGO/logo-dark.png" width="140">
  </div>
</body>
</html>
