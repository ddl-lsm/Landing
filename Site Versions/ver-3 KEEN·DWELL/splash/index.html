<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEEN·DWELL — Coming Soon</title>
  <meta name="description" content="Sharp homes. Quietly engineered.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'ForoMed';
      src: url('/fonts/ForoMed.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #0c0c0e;
      --amber: #EABB30;
      --blue:  #2E66DB;
      --text:  #ffffff;
      --muted: rgba(255,255,255,0.38);
      --grid:  rgba(255,255,255,0.032);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      width: 700px;
      height: 320px;
      background: radial-gradient(ellipse, rgba(234,187,48,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lockup img {
      height: clamp(3.5rem, 8vw, 5.5rem);
      width: auto;
    }

    .wordmark {
      font-family: 'ForoMed', 'Inter', sans-serif;
      font-size: clamp(2.75rem, 7vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .wordmark .keen  { color: var(--amber); }
    .wordmark .dot   { color: var(--blue);  }
    .wordmark .dwell { color: var(--text);  }

    .tagline {
      font-size: clamp(0.8125rem, 1.8vw, 1rem);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .coming-soon {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--blue);
      border: 1px solid rgba(46,102,219,0.4);
      padding: 0.38em 1.1em;
      border-radius: 2px;
    }

    .protocols {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .protocols svg {
      height: 32px;
      width: auto;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .protocols svg:hover { opacity: 1; }

    .domain {
      position: fixed;
      bottom: 1.75rem;
      font-size: 0.6875rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.1em;
    }

    @media (max-width: 520px) {
      .lockup img { height: 3rem; }
      .protocols { gap: 1rem; }
      .protocols svg { height: 24px; }
    }
  </style>
</head>
<body>
  <div class="center">

    <div class="lockup">
      <img src="LOGO/logo-dark.png" alt="KEEN·DWELL">
      <div class="wordmark">
        <span class="keen">KEEN</span><span class="dot">·</span><span class="dwell">DWELL</span>
      </div>
    </div>

    <p class="tagline">Sharp homes. Quietly engineered.</p>
    <div class="divider"></div>
    <div class="coming-soon">Coming Soon</div>

    <div class="protocols">

      <!-- KNX: text logo, brand blue -->
      <svg viewBox="0 0 64 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KNX">
        <text y="23" font-family="'Arial Black','Helvetica Neue',sans-serif" font-weight="900" font-size="24" fill="#3A8FDB" letter-spacing="-0.5">KNX</text>
      </svg>

      <!-- Loxone: text logo, brand green -->
      <svg viewBox="0 0 100 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loxone">
        <text y="21" font-family="Arial,sans-serif" font-weight="700" font-size="17" fill="#69AB3B" letter-spacing="2">LOXONE</text>
      </svg>

      <!-- ASHRAE BACnet -->
      <svg viewBox="0 0 118 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BACnet">
        <!-- ASHRAE circle badge -->
        <circle cx="14" cy="14" r="13" fill="#004B8D"/>
        <!-- building silhouette -->
        <rect x="9"  y="10" width="10" height="11" fill="white" rx="1"/>
        <rect x="11" y="16" width="3"  height="5"  fill="#004B8D"/>
        <polygon points="7,12 14,7 21,12" fill="white"/>
        <!-- ASHRAE small label inside circle -->
        <text x="14" y="27" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" fill="white" font-weight="600">ASHRAE</text>
        <!-- BACnet text -->
        <text x="34" y="20" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#004B8D">BACnet</text>
      </svg>

      <!-- Home Assistant -->
      <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Home Assistant">
        <rect width="34" height="34" rx="7" fill="#41BDF5"/>
        <!-- house walls -->
        <path d="M17 9 L7 17 L7 27 L13 27 L13 21 L21 21 L21 27 L27 27 L27 17 Z" fill="white"/>
        <!-- wifi arc 1 -->
        <path d="M13 17 Q17 13 21 17" stroke="#41BDF5" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- wifi arc 2 -->
        <path d="M11 15 Q17 9 23 15" stroke="#41BDF5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
        <!-- center dot -->
        <circle cx="17" cy="19" r="1.8" fill="#41BDF5"/>
      </svg>

      <!-- Siemens LOGO! -->
      <svg viewBox="0 0 58 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Siemens LOGO!">
        <!-- LOGO! box -->
        <rect x="0" y="0" width="58" height="19" rx="3" fill="#5A5A5A"/>
        <text x="29" y="13.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11" fill="white" letter-spacing="0.5">LOGO!</text>
        <!-- SIEMENS text -->
        <text x="29" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#009999" letter-spacing="0.8">SIEMENS</text>
      </svg>

    </div>
  </div>

  <p class="domain">keendwell.com</p>
</body>
</html>
