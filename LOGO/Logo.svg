<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&amp;display=swap');</style>

  <!-- Dark background for standalone preview -->
  <rect width="560" height="200" fill="#0c0c0e" rx="12"/>

  <!-- ===== ICON (0 0 200 200) ===== -->

  <!-- ROOF: outer filled shape minus inner cutout = double-line effect -->
  <polygon points="0,80 100,5 200,80" fill="#FFFFFF"/>
  <polygon points="18,80 100,22 182,80" fill="#0c0c0e"/>
  <!-- Chimney -->
  <rect x="120" y="5" width="22" height="32" fill="#FFFFFF"/>
  <rect x="115" y="1" width="32" height="9" fill="#FFFFFF"/>

  <!-- YELLOW CROSS -->
  <rect x="28" y="108" width="144" height="52" rx="22" fill="#EEB825"/>
  <rect x="78"  y="76"  width="44"  height="124" rx="20" fill="#EEB825"/>

  <!-- WHITE CORNER PIECES (fill the 4 diagonal gaps of the cross) -->
  <rect x="28"  y="76"  width="50" height="32" rx="11" fill="#FFFFFF"/>
  <rect x="122" y="76"  width="50" height="32" rx="11" fill="#FFFFFF"/>
  <rect x="28"  y="160" width="50" height="40" rx="11" fill="#FFFFFF"/>
  <rect x="122" y="160" width="50" height="40" rx="11" fill="#FFFFFF"/>

  <!-- WIFI SYMBOL (white, upper center of cross) -->
  <circle cx="100" cy="122" r="5.5" fill="#FFFFFF"/>
  <path d="M87,111 Q100,103 113,111" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M75,102 Q100,89 125,102" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- S-CONNECTOR (white, lower center of cross) -->
  <rect x="84" y="141" width="32" height="14" rx="7" fill="#FFFFFF" transform="rotate(-12 100 148)"/>
  <rect x="84" y="157" width="32" height="14" rx="7" fill="#FFFFFF" transform="rotate(12 100 164)"/>

  <!-- ===== WORDMARK (x=220) ===== -->
  <text x="222" y="116"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="44" letter-spacing="-0.5">
    <tspan font-weight="700" fill="#FFFFFF">Smart</tspan>
    <tspan font-weight="700" fill="#EEB825">Build</tspan>
    <tspan font-weight="300" fill="#B0B0C0">Tech</tspan>
  </text>
  <text x="223" y="136"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="500" fill="#505065" letter-spacing="3">SMART HOME · CUSTOM APPS</text>
</svg>
