  <style>
/* ================================================================
   SmartBuildTech — Scandinavian Redesign
   White + Black + Yellow accent
   ================================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* surfaces */
  --bg:        #FAFAF7;
  --bg-alt:    #F2F1EC;
  --surface:   #FFFFFF;
  --ink:       #0A0A0A;
  --ink-2:     #3D3D3D;
  --ink-3:     #707070;
  --ink-4:     #A8A8A4;
  --border:    #E6E5E0;
  --border-2:  #D4D3CD;

  /* brand yellow (matches logo) */
  --yellow:        #F5BC2D;
  --yellow-deep:   #E5A810;
  --yellow-soft:   #FFF1C9;
  --yellow-haze:   rgba(245, 188, 45, 0.12);

  /* dark accent for inverted blocks */
  --dark:      #111111;
  --dark-2:    #1B1B1B;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 18px;

  --t:  0.18s ease;
  --t2: 0.32s cubic-bezier(.2,.8,.2,1);

  --max: 1240px;
}

html { scroll-behavior: smooth; }

body {
  font-family: "Geist", "Inter Tight", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; background: none; border: none; cursor: pointer; color: inherit; }
img, svg { display: block; max-width: 100%; }

.container {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 28px;
}

.mono { font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "ss01"; }

/* ====================== TOP UTILITY BAR ====================== */
.varbar {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  gap: 4px;
  padding: 5px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.18);
}
.varbar button {
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: rgba(255,255,255,0.65);
  border-radius: 100px;
  transition: all var(--t);
}
.varbar button:hover { color: #fff; }
.varbar button.active {
  background: var(--yellow);
  color: #0A0A0A;
}
.varbar .vb-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  padding: 8px 10px 8px 14px;
  pointer-events: none;
}

/* ====================== NAV ====================== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  transition: background var(--t2), border-color var(--t2);
  border-bottom: 1px solid transparent;
}
.nav.scrolled {
  background: rgba(250,250,247,0.85);
  backdrop-filter: blur(14px);
  border-bottom-color: var(--border);
}
.nav-inner {
  max-width: var(--max);
  margin: 0 auto;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 36px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.03em;
}
.brand img { width: 42px; height: 42px; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
  list-style: none;
}
.nav-links a {
  font-size: 14px;
  color: var(--ink-2);
  padding: 8px 14px;
  border-radius: 100px;
  transition: color var(--t);
}
.nav-links a:hover { color: var(--ink); }
.nav-cta { margin-left: auto; }

/* ====================== BUTTONS ====================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--t);
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.btn-primary:hover {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--ink);
}
.btn-yellow {
  background: var(--yellow);
  color: var(--ink);
  border-color: var(--yellow);
}
.btn-yellow:hover { background: var(--yellow-deep); border-color: var(--yellow-deep); }
.btn-ghost {
  color: var(--ink);
  border-color: var(--border-2);
  background: transparent;
}
.btn-ghost:hover { border-color: var(--ink); }
.btn-lg { padding: 15px 28px; font-size: 15px; }
.btn-arrow svg { transition: transform var(--t); }
.btn-arrow:hover svg { transform: translateX(3px); }

/* ====================== EYEBROW / TAG ====================== */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
}
.eyebrow .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--yellow);
}

/* ====================== HERO COMMON ====================== */
.hero {
  position: relative;
  padding: 130px 0 80px;
  overflow: hidden;
}
.h-display {
  font-weight: 500;
  font-size: clamp(48px, 8.4vw, 116px);
  line-height: 0.95;
  letter-spacing: -0.045em;
  color: var(--ink);
}
.h-display .accent {
  background: linear-gradient(180deg, var(--yellow) 0%, var(--yellow-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.h-display .underline {
  position: relative;
  display: inline-block;
}
.h-display .underline::after {

}
.shd-room {
  position: absolute;
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--t);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 10px;
  overflow: hidden;
}
.shd-room:hover { border-color: rgba(245,188,45,0.5); }
.shd-room.on {
  background: radial-gradient(circle at 50% 30%, rgba(245,188,45,0.35) 0%, rgba(245,188,45,0.06) 70%);

.shd-room .rname {

}

.shd-room .bulb {
  position: absolute;
  top: 8px; right: 8px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: all var(--t);
}
.shd-room.on .bulb {
  background: var(--yellow);

}

/* Right column: device tiles */
.shd-side {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.shd-tile {
  background: #1A1A1A;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;

}

.shd-tile .l {
  display: flex;
  align-items: center;
  gap: 12px;
}
.shd-tile .icn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.7);
}
.shd-tile.on .icn {
  background: var(--yellow);
  color: var(--ink);
}
.shd-tile .nm { font-size: 13px; font-weight: 500; }
.shd-tile .vl { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

/* Toggle switch */
.tgl {
  width: 36px; height: 20px;
  background: rgba(255,255,255,0.12);
  border-radius: 100px;
  position: relative;
  cursor: pointer;
  transition: background var(--t);
}
.tgl::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: #fff;
  border-radius: 50%;
  transition: transform var(--t);
}
.tgl.on { background: var(--yellow); }
.tgl.on::after { transform: translateX(16px); }

/* Slider */
.shd-slider {
  background: #1A1A1A;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px 16px;
}
.shd-slider .top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.shd-slider .top .nm { font-size: 13px; font-weight: 500; }
.shd-slider .top .vl { font-size: 13px; color: var(--yellow); font-variant-numeric: tabular-nums; }
.shd-slider .track {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 100px;
  position: relative;
  cursor: pointer;
}
.shd-slider .fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: var(--yellow);
  border-radius: 100px;
  transition: width var(--t);
}
.shd-slider .knob {
  position: absolute;
  top: 50%;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%);

}

  background: var(--yellow);

.svc-foot {

.svc.featured {

}

.svc.featured .svc-num { color: rgba(255,255,255,0.4); }

}

/* ====================== FOOTER ====================== */
.footer {

}

.footer-links a { font-size: 13px; color: var(--ink-3); transition: color var(--t); }
.footer-links a:hover { color: var(--ink); }

[data-anim] {

  transform: none;
}

@media (max-width: 980px) {

}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* global React */
const { useState, useEffect, useRef } = React;

// === Smart Home Live Demo ===
function SmartHomeDemo({ size = "lg" }) {
  const [tab, setTab] = useState("light");
  const [rooms, setRooms] = useState({
    living:   { on: true,  temp: 22 },
    kitchen:  { on: false, temp: 21 },
    bed:      { on: false, temp: 19 },
    bath:     { on: false, temp: 23 },
    office:   { on: true,  temp: 20 },
  });
  const [tiles, setTiles] = useState({
    door:    { on: true,  v: "Locked" },
    cam:     { on: true,  v: "5 cameras · online" },
    music:   { on: false, v: "Sonos · living room" },
  });
  const [bright, setBright] = useState(72);
  const [climate, setClimate] = useState(21);

  // Auto-cycle a few rooms for "alive" feel when idle
  const idleRef = useRef(0);
  useEffect(() => {
    const id = setInterval(() => {
      idleRef.current += 1;
      const keys = ["living", "kitchen", "bed", "bath", "office"];
      const k = keys[idleRef.current % keys.length];
      setRooms(prev => ({
        ...prev,
        [k]: { ...prev[k], on: !prev[k].on }
      }));
    }, 4200);
    return () => clearInterval(id);
  }, []);

  const toggleRoom = (k) => {
    setRooms(prev => ({ ...prev, [k]: { ...prev[k], on: !prev[k].on } }));
  };
  const toggleTile = (k) => {
    setTiles(prev => ({ ...prev, [k]: { ...prev[k], on: !prev[k].on } }));
  };

  // Slider drag
  const trackRef = useRef(null);
  const onTrackClick = (e) => {
    const r = trackRef.current.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
    setBright(Math.round(pct));
  };

  return (
    <div className="shd">
      <div className="shd-header">
        <div className="shd-title">
          <span className="shd-pulse"></span>
          <span>Home · Hallway</span>
          <span className="mono" style={{ color: "rgba(255,255,255,0.4)", fontSize: 12, marginLeft: 4 }}>online</span>
        </div>
        <div className="shd-tabs">
          <button className={tab === "light" ? "active" : ""} onClick={() => setTab("light")}>Lights</button>
          <button className={tab === "climate" ? "active" : ""} onClick={() => setTab("climate")}>Climate</button>
          <button className={tab === "secure" ? "active" : ""} onClick={() => setTab("secure")}>Security</button>
        </div>
      </div>

      <div className="shd-grid">
        {/* Floor plan */}
        <div className="shd-floor">
          {/* Living room */}
          <div
            className={`shd-room ${rooms.living.on ? "on" : ""}`}
            style={{ left: "4%", top: "4%", width: "55%", height: "52%" }}
            onClick={() => toggleRoom("living")}
          >
            <div className="bulb"></div>
            <div className="rname">Living room</div>
            <div className="rtemp">{rooms.living.temp}° · {rooms.living.on ? "on" : "off"}</div>
          </div>
          {/* Kitchen */}
          <div
            className={`shd-room ${rooms.kitchen.on ? "on" : ""}`}
            style={{ left: "61%", top: "4%", width: "35%", height: "32%" }}
            onClick={() => toggleRoom("kitchen")}
          >
            <div className="bulb"></div>
            <div className="rname">Kitchen</div>
            <div className="rtemp">{rooms.kitchen.temp}°</div>
          </div>
          {/* Bath */}
          <div
            className={`shd-room ${rooms.bath.on ? "on" : ""}`}
            style={{ left: "61%", top: "38%", width: "35%", height: "18%" }}
            onClick={() => toggleRoom("bath")}
          >
            <div className="bulb"></div>
            <div className="rname">Bath</div>
          </div>
          {/* Bedroom */}
          <div
            className={`shd-room ${rooms.bed.on ? "on" : ""}`}
            style={{ left: "4%", top: "58%", width: "40%", height: "38%" }}
            onClick={() => toggleRoom("bed")}
          >
            <div className="bulb"></div>
            <div className="rname">Bedroom</div>
            <div className="rtemp">{rooms.bed.temp}°</div>
          </div>
          {/* Office */}
          <div
            className={`shd-room ${rooms.office.on ? "on" : ""}`}
            style={{ left: "46%", top: "58%", width: "50%", height: "38%" }}
            onClick={() => toggleRoom("office")}
          >
            <div className="bulb"></div>
            <div className="rname">Office</div>
            <div className="rtemp">{rooms.office.temp}°</div>
          </div>
        </div>

        {/* Side tiles */}
        <div className="shd-side">
          <div className="shd-slider">
            <div className="top">
              <div className="nm">Brightness</div>
              <div className="vl mono">{bright}%</div>
            </div>
            <div className="track" ref={trackRef} onClick={onTrackClick}>
              <div className="fill" style={{ width: `${bright}%` }}></div>
              <div className="knob" style={{ left: `${bright}%` }}></div>
            </div>
          </div>

          <div className={`shd-tile ${tiles.door.on ? "on" : ""}`}>
            <div className="l">
              <div className="icn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <rect x="6" y="3" width="12" height="18" rx="1"/>
                  <circle cx="14" cy="12" r="1" fill="currentColor"/>
                </svg>
              </div>
              <div>
                <div className="nm">Front door</div>
                <div className="vl">{tiles.door.v}</div>
              </div>
            </div>
            <div className={`tgl ${tiles.door.on ? "on" : ""}`} onClick={() => toggleTile("door")}></div>
          </div>

          <div className={`shd-tile ${tiles.cam.on ? "on" : ""}`}>
            <div className="l">
              <div className="icn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M23 7l-7 5 7 5V7z"/>
                  <rect x="1" y="5" width="15" height="14" rx="2"/>
                </svg>
              </div>
              <div>
                <div className="nm">Cameras</div>
                <div className="vl">{tiles.cam.v}</div>
              </div>
            </div>
            <div className={`tgl ${tiles.cam.on ? "on" : ""}`} onClick={() => toggleTile("cam")}></div>
          </div>

          <div className={`shd-tile ${tiles.music.on ? "on" : ""}`}>
            <div className="l">
              <div className="icn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
              <div>
                <div className="nm">Music</div>
                <div className="vl">{tiles.music.v}</div>
              </div>
            </div>
            <div className={`tgl ${tiles.music.on ? "on" : ""}`} onClick={() => toggleTile("music")}></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function OrbitNode({ deg, r, label, icon, small }) {
  const rad = (deg * Math.PI) / 180;
  const x = 50 + r * Math.cos(rad);
  const y = 50 + r * Math.sin(rad);
  const sz = small ? 44 : 60;
  const icons = {
    bulb: "M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.8.7 1 1.4 1 2.3v1h6v-1c0-.9.2-1.6 1-2.3A7 7 0 0012 2z",
    temp: "M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z",
    cam:  "M23 7l-7 5 7 5V7zM1 5h15v14H1z",
    lock: "M5 11h14v10H5zM8 11V7a4 4 0 018 0v4",
    wifi: "M5 12.55a11 11 0 0114 0M1.42 9a16 16 0 0121 0M8.5 16.43a6 6 0 017 0M12 20h.01",
    music:"M9 18V5l12-2v13M6 21a3 3 0 100-6 3 3 0 000 6zM18 19a3 3 0 100-6 3 3 0 000 6z",
  };
  return (
    <div style={{
      position: "absolute",
      left: `${x}%`, top: `${y}%`,
      width: sz, height: sz,
      transform: "translate(-50%, -50%)",
      background: "#fff",
      borderRadius: "50%",
      border: "1px solid #E6E5E0",
      display: "flex", alignItems: "center", justifyContent: "center",
      boxShadow: "0 4px 16px rgba(0,0,0,0.04)",
      animation: `floaty 4s ease-in-out infinite`,
      animationDelay: `${(deg % 360) / 60}s`,
      color: "#0A0A0A",
    }}>
      <svg width={small ? 18 : 22} height={small ? 18 : 22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        <path d={icons[icon]} />
      </svg>
      {!small && (
        <div style={{
          position: "absolute", top: "100%", left: "50%",
          transform: "translateX(-50%)",
          marginTop: 8,
          fontSize: 11,
          color: "#707070",
          whiteSpace: "nowrap",
          letterSpacing: "0.04em",
        }}>{label}</div>
      )}
    </div>
  );
}

// =========================================================
// TWEAKS
// =========================================================
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F5BC2D",
  "darkProcess": true,
  "showMarquee": true
}/*EDITMODE-END*/;

function Tweaks() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply accent live
  useEffect(() => {
    document.documentElement.style.setProperty("--yellow", t.accent);
  }, [t.accent]);

  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Brand">
        <TweakColor
          label="Accent color"
          value={t.accent}
          onChange={(v) => setTweak("accent", v)}
          options={["#F5BC2D", "#FF8A1F", "#3D5AFE", "#1FB87A", "#0A0A0A"]}
        />
      </TweakSection>
      <TweakSection title="Layout">
        <TweakToggle
          label="Show tech marquee"
          value={t.showMarquee}
          onChange={(v) => setTweak("showMarquee", v)}
        />
        <TweakToggle
          label="Dark Process section"
          value={t.darkProcess}
          onChange={(v) => setTweak("darkProcess", v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

// =========================================================
// APP
// =========================================================
function App() {
  const [variant, setVariant] = useState("v1");

  // entrance anim observer
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add("in");
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll("[data-anim]").forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, [variant]);

  return (
    <>
      <VariantBar variant={variant} setVariant={setVariant} />
      <Nav />
      {variant === "v1" && <HeroV1 />}
      {variant === "v2" && <HeroV2 />}
      {variant === "v3" && <HeroV3 />}
      <Services />
      <Process />
      <Contact />
      <Footer />
      <Tweaks />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


</script>
